<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C232C"/><stop offset="1" stop-color="#0B0F13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity="0.18"/><stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- face box (teal), top right -->
  <rect x="430" y="170" width="400" height="400" rx="56" fill="none" stroke="#2EC4B6" stroke-width="40"/>
  <!-- hand box (orange), bottom left, over it -->
  <rect x="194" y="400" width="440" height="440" rx="60" fill="none" stroke="#FF8A3D" stroke-width="40"/>
  <!-- d1 -->
  <text x="512" y="640" text-anchor="middle" font-family="Helvetica Neue" font-weight="800" font-size="380" letter-spacing="-12" fill="#FFFFFF" stroke="#1A1D22" stroke-width="36" stroke-linejoin="round" paint-order="stroke">d1</text>
</svg>
